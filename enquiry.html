<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Rachel's Kota Place</title>
</head>

<body>

    <header>
        <h1>Enquiry Form</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="products.html">Products</a> |
            <a href="contact.html">Contact Us</a> |
            <a href="enquiry.html">Enquiry</a>
        </nav>
    </header>

    <main>

        <h2>Send Us An Enquiry</h2>

        <form>

            <label for="name">Full Name:</label>
            <br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="phone">Phone Number:</label>
            <br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="product">Product:</label>
            <br>

            <select id="product" name="product">
                <option value="princess">Princess Kota</option>
                <option value="prince">Prince Kota</option>
                <option value="queen">Queen Kota</option>
                <option value="king">King Kota</option>
                <option value="empire">Empire Kota</option>
                <option value="chips">Chips</option>
                <option value="drinks">Drinks</option>
                <option value="milkshake">Milkshake</option>
                <option value="ice-cream">Ice Cream</option>
            </select>

            <br><br>

            <label for="message">Message:</label>
            <br>

            <textarea id="message" name="message" rows="6" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Submit Enquiry">
            <input type="reset" value="Clear">

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Rachel's Kota Place. All Rights Reserved.</p>
    </footer>

</body>
</html>
