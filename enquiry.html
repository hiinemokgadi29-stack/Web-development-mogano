<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Rachel's Kota Place</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <nav class="nav nav-left">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
        </nav>
        <a class="logo-wrap" href="index.html">
            <img class="site-logo" src="images/logo.png" alt="Rachel's Kota Place logo">
        </a>
        <nav class="nav nav-right">
            <a href="products.html">Products</a>
            <a href="contact.html">Contact Us</a>
            <a class="active" href="enquiry.html">Enquiry</a>
        </nav>
    </div>
    <div class="header-line"></div>
</header>

<main>
    <section class="section yellow-section">
        <div class="section-inner">
            <div class="form-card">
                <h2>Send Us An Enquiry</h2>
                <p class="form-intro">Fill in your details and tell us what you would like to order.</p>

                <form action="#" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </div>

                        <div class="form-group">
                            <label for="product">Product</label>
                            <select id="product" name="product" required>
                                <option value="">Select a product</option>
                                <option value="princess">Princess Kota</option>
                                <option value="prince">Prince Kota</option>
                                <option value="queen">Queen Kota</option>
                                <option value="king">King Kota</option>
                                <option value="empire">Empire Kota</option>
                                <option value="chips">Chips</option>
                                <option value="drinks">Drinks</option>
                                <option value="milkshake">Milkshake</option>
                                <option value="ice-cream">Ice Cream</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Tell us what you would like to order..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button class="btn" type="submit">Submit Enquiry →</button>
                        <button class="btn btn-secondary" type="reset">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Rachel's Kota Place. All Rights Reserved.</p>
</footer>

</body>
</html>
